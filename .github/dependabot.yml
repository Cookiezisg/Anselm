# Weekly dependency PRs, grouped per ecosystem so one review covers a batch. Sparkle is pinned by
# an exact Swift Package version and is bumped by hand after the signing chain is re-checked.
# 每周依赖 PR,按生态分组,一次审一批。Sparkle 由 Swift Package 精确钉版,复核签名链后手动升。
version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule: {interval: weekly}
    groups:
      go: {patterns: ['*']}
  - package-ecosystem: gomod
    directory: /testend
    schedule: {interval: weekly}
    groups:
      go: {patterns: ['*']}
  # Major Dart package bumps (freezed 4, go_router 18, …) are migrations, not merges, and some
  # need a newer Dart SDK than the pinned Flutter ships; only minor/patch arrive as a group.
  # Dart 包的大版本(freezed 4、go_router 18 等)是迁移不是合并,有的还要求比钉住的 Flutter 更新的 SDK;
  # 只成组提 minor/patch。
  - package-ecosystem: pub
    directory: /frontend
    schedule: {interval: weekly}
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      dart: {patterns: ['*'], update-types: ['minor', 'patch']}
  - package-ecosystem: npm
    directory: /demo
    schedule: {interval: weekly}
    groups:
      node: {patterns: ['*']}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups:
      actions: {patterns: ['*']}
