# Static security analysis for the Go sidecar on every push, pull request, and weekly.
# Go sidecar 的静态安全分析:push、PR 与每周一次。
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: backend/go.sum
      - uses: github/codeql-action/init@v3
        with:
          languages: go
      - name: Build
        working-directory: backend
        run: go build ./...
      - uses: github/codeql-action/analyze@v3
