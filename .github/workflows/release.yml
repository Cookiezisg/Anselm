# Release: build the desktop app with its Go sidecar for macOS, Linux, and Windows, and publish
# the archives plus checksums to a GitHub Release. Triggered by a `v<version>` tag whose version
# must equal `frontend/pubspec.yaml`, so one number drives the app, the sidecar, and the artifact
# names. macOS artifacts are Developer ID signed and notarized when the secrets are present, and
# the Sparkle appcast ships as a release asset; Windows and Linux artifacts are unsigned.
#
# 发行:为 macOS、Linux、Windows 构建带 Go sidecar 的桌面 app,把归档和校验和发布到 GitHub Release。由
# `v<version>` tag 触发,版本必须等于 frontend/pubspec.yaml,这样一个数字驱动 app、sidecar 和产物名。
# macOS 在 secrets 齐备时做 Developer ID 签名与公证,Sparkle appcast 随 release 发布;Windows 与 Linux 未签名。
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.44.8
  GO_VERSION: '1.25'

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pub="$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' frontend/pubspec.yaml)"
          [[ "$tag" == "$pub" ]] || { echo "tag v$tag does not match pubspec version $pub" >&2; exit 1; }
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  macos:
    needs: version
    runs-on: macos-26
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Universal sidecar so the one DMG runs on Apple silicon and Intel.
      - name: Build sidecar (universal)
        working-directory: backend
        run: |
          for arch in arm64 amd64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${{ needs.version.outputs.version }}" \
              -o "../build/sidecar/anselm-server-$arch" ./cmd/server
          done
          lipo -create -output ../build/sidecar/anselm-server \
            ../build/sidecar/anselm-server-arm64 ../build/sidecar/anselm-server-amd64
      # The macOS host is Swift Package Manager only (no Podfile), so SPM must be on for the plugins
      # to see the Flutter module; the runner needs an Xcode new enough for the plugins' Package.swift.
      - name: Build app
        working-directory: frontend
        run: |
          flutter config --enable-swift-package-manager
          flutter pub get
          flutter build macos --release --no-tree-shake-icons
      # Developer ID signing and notarization run only when the secrets exist, so a fork or a
      # release before the certificate lands still produces an ad-hoc signed DMG. The certificate
      # goes into a throwaway keychain that is deleted at the end of the job.
      # 只有 secrets 存在时才做 Developer ID 签名与公证,fork 或证书到位前的发行照样出 ad-hoc DMG。
      # 证书导入一次性钥匙串,job 结束即删。
      - name: Import signing identity
        if: env.MACOS_CERT_P12 != ''
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          identity="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)"
          [[ -n "$identity" ]] || { echo "no Developer ID Application identity in the certificate" >&2; exit 1; }
          echo "MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/cert.p12"
      - name: Notary key
        if: env.NOTARY_KEY_P8 != ''
        env:
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      # Sparkle's command-line tools generate the appcast; pinned to the same release the app links.
      - name: Sparkle tools and feed key
        if: env.SPARKLE_PRIVATE_KEY != ''
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/sparkle.tar.xz" https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-2.10.0.tar.xz
          mkdir -p "$RUNNER_TEMP/sparkle" && tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle.key"
          echo "SPARKLE_BIN=$RUNNER_TEMP/sparkle/bin" >> "$GITHUB_ENV"
          echo "SPARKLE_PRIVATE_KEY_PATH=$RUNNER_TEMP/sparkle.key" >> "$GITHUB_ENV"
      - name: Package
        working-directory: frontend
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          npm install -g appdmg
          bash tool/package.sh "${{ needs.version.outputs.version }}" ../build/sidecar/anselm-server dist
      - name: Remove signing identity
        if: always() && env.SIGNING_KEYCHAIN != ''
        run: security delete-keychain "$SIGNING_KEYCHAIN"; rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/sparkle.key"
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            frontend/dist/*.dmg
            frontend/dist/appcast.xml
          if-no-files-found: error

  linux:
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libmpv-dev
      - name: Build sidecar
        working-directory: backend
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X main.version=${{ needs.version.outputs.version }}" \
            -o ../build/sidecar/anselm-server ./cmd/server
      - name: Build app
        working-directory: frontend
        run: |
          flutter pub get
          flutter build linux --release --no-tree-shake-icons
      # appimagetool is itself an AppImage; --appimage-extract-and-run inside package.sh avoids FUSE.
      - name: appimagetool
        run: |
          curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /usr/local/bin/appimagetool
      - name: Package
        working-directory: frontend
        run: bash tool/package.sh "${{ needs.version.outputs.version }}" ../build/sidecar/anselm-server dist
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            frontend/dist/*.tar.gz
            frontend/dist/*.AppImage
            frontend/dist/*.deb
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build sidecar
        working-directory: backend
        shell: bash
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X main.version=${{ needs.version.outputs.version }}" \
            -o ../build/sidecar/anselm-server.exe ./cmd/server
      - name: Build app
        working-directory: frontend
        run: |
          flutter pub get
          flutter build windows --release --no-tree-shake-icons
      # The sidecar sits next to anselm.exe, which is where BackendController resolves it.
      - name: Package
        working-directory: frontend
        shell: pwsh
        run: |
          $v = "${{ needs.version.outputs.version }}"
          $rel = "build\windows\x64\runner\Release"
          Copy-Item ..\build\sidecar\anselm-server.exe "$rel\anselm-server.exe"
          New-Item -ItemType Directory -Force dist | Out-Null
          $stage = Join-Path $env:RUNNER_TEMP "Anselm-$v"
          Copy-Item $rel $stage -Recurse
          Compress-Archive -Path $stage -DestinationPath "dist\Anselm-$v-windows-x64.zip" -Force
      # Inno Setup ships on the Windows runner image; install it if a future image drops it.
      - name: Installer
        working-directory: frontend
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Null }
          & $iscc "/DAppVersion=${{ needs.version.outputs.version }}" "/DSourceDir=$PWD\build\windows\x64\runner\Release" "/DOutputDir=$PWD\dist" windows\installer\anselm.iss
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            frontend/dist/*.zip
            frontend/dist/*-setup.exe
          if-no-files-found: error

  publish:
    needs: [version, macos, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      # Release notes come from the conventional commits since the previous tag (cliff.toml);
      # commits land on main directly, so GitHub's PR-based notes would be empty.
      # Release notes 由上一个 tag 以来的 conventional commits 生成(cliff.toml);提交直推 main,
      # GitHub 按 PR 生成的 notes 会是空的。
      - uses: orhun/git-cliff-action@v4
        id: notes
        with:
          config: cliff.toml
          args: --latest --strip all
        env:
          OUTPUT: release-notes.md
      - name: Checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      # One release with every platform, or none: a failed platform job stops this job from running.
      # Create the release first, then upload assets one at a time with retries: a single
      # transient 400 from the upload endpoint must not leave a half-populated release behind.
      # 先建 release,再逐个带重试上传资产:上传接口偶发 400 不能留下半个 release。
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Anselm ${{ needs.version.outputs.version }}" \
            --notes-file release-notes.md --verify-tag
          for f in artifacts/*; do
            for attempt in 1 2 3 4 5; do
              gh release upload "$GITHUB_REF_NAME" "$f" --clobber && break
              echo "upload of $f failed (attempt $attempt), retrying"; sleep $((attempt * 15))
              [[ $attempt -lt 5 ]] || exit 1
            done
          done
