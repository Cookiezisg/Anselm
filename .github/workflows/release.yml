# Release: build the desktop app with its Go sidecar for macOS, Linux, and Windows, and publish
# the archives plus checksums to a GitHub Release. Triggered by a `v<version>` tag whose version
# must equal `frontend/pubspec.yaml`, so one number drives the app, the sidecar, and the artifact
# names. Artifacts are ad-hoc signed on macOS and unsigned elsewhere; a trusted signing chain is a
# separate step (docs/working/platform-foundation/release-distribution-playbook.md).
#
# 发行:为 macOS、Linux、Windows 构建带 Go sidecar 的桌面 app,把归档和校验和发布到 GitHub Release。由
# `v<version>` tag 触发,版本必须等于 frontend/pubspec.yaml,这样一个数字驱动 app、sidecar 和产物名。
# macOS 为 ad-hoc 签名,其它平台未签名;可信签名链是独立的一步(见发行合同)。
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.44.8
  GO_VERSION: '1.25'

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pub="$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' frontend/pubspec.yaml)"
          [[ "$tag" == "$pub" ]] || { echo "tag v$tag does not match pubspec version $pub" >&2; exit 1; }
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  macos:
    needs: version
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Universal sidecar so the one DMG runs on Apple silicon and Intel.
      - name: Build sidecar (universal)
        working-directory: backend
        run: |
          for arch in arm64 amd64; do
            CGO_ENABLED=0 GOOS=darwin GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${{ needs.version.outputs.version }}" \
              -o "../build/sidecar/anselm-server-$arch" ./cmd/server
          done
          lipo -create -output ../build/sidecar/anselm-server \
            ../build/sidecar/anselm-server-arm64 ../build/sidecar/anselm-server-amd64
      # The macOS host is Swift Package Manager only (no Podfile), so SPM must be on for the plugins
      # to see the Flutter module; the runner needs an Xcode new enough for the plugins' Package.swift.
      - name: Build app
        working-directory: frontend
        run: |
          flutter config --enable-swift-package-manager
          flutter pub get
          flutter build macos --release --no-tree-shake-icons
      - name: Package
        working-directory: frontend
        run: bash tool/package.sh "${{ needs.version.outputs.version }}" ../build/sidecar/anselm-server dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: frontend/dist/*.dmg
          if-no-files-found: error

  linux:
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libmpv-dev
      - name: Build sidecar
        working-directory: backend
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X main.version=${{ needs.version.outputs.version }}" \
            -o ../build/sidecar/anselm-server ./cmd/server
      - name: Build app
        working-directory: frontend
        run: |
          flutter pub get
          flutter build linux --release --no-tree-shake-icons
      - name: Package
        working-directory: frontend
        run: bash tool/package.sh "${{ needs.version.outputs.version }}" ../build/sidecar/anselm-server dist
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: frontend/dist/*.tar.gz
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: backend/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build sidecar
        working-directory: backend
        shell: bash
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X main.version=${{ needs.version.outputs.version }}" \
            -o ../build/sidecar/anselm-server.exe ./cmd/server
      - name: Build app
        working-directory: frontend
        run: |
          flutter pub get
          flutter build windows --release --no-tree-shake-icons
      # The sidecar sits next to anselm.exe, which is where BackendController resolves it.
      - name: Package
        working-directory: frontend
        shell: pwsh
        run: |
          $v = "${{ needs.version.outputs.version }}"
          $rel = "build\windows\x64\runner\Release"
          Copy-Item ..\build\sidecar\anselm-server.exe "$rel\anselm-server.exe"
          New-Item -ItemType Directory -Force dist | Out-Null
          $stage = Join-Path $env:RUNNER_TEMP "Anselm-$v"
          Copy-Item $rel $stage -Recurse
          Compress-Archive -Path $stage -DestinationPath "dist\Anselm-$v-windows-x64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: frontend/dist/*.zip
          if-no-files-found: error

  publish:
    needs: [version, macos, linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      # One release with every platform, or none: a failed platform job stops this job from running.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --title "Anselm ${{ needs.version.outputs.version }}" \
            --generate-notes
