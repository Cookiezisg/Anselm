name: anselm_updater
description: In-app updater for the Anselm desktop app. macOS uses Sparkle 2 (Swift package, sandbox-safe); other platforms report unsupported and the app falls back to its GitHub Releases check.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      macos:
        pluginClass: AnselmUpdaterPlugin
