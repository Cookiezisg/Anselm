name: media_kit_video
description: Native implementation for video playback in package:media_kit.
homepage: https://github.com/media-kit/media-kit
repository: https://github.com/media-kit/media-kit
version: 2.0.1
topics:
  - video
  - video-player
  - audio
  - audio-player
  - cross-platform

environment:
  sdk: ">=2.17.0 <4.0.0"
  flutter: ">=3.7.0"

dependencies:
  flutter:
    sdk: flutter

  media_kit: ^1.2.3

  synchronized: ^3.1.0
  wakelock_plus: ^1.1.6
  universal_platform: ^1.0.0+1
  plugin_platform_interface: ^2.0.2
  web: ^1.1.0

dev_dependencies:
  flutter_lints: ^5.0.0



flutter:
  plugin:
    platforms:
      # LINUX ONLY — this is the ONE line of divergence from upstream, and the entire reason this
      # package is vendored. Upstream declares macos/ios too, which makes Flutter keep the CocoaPods
      # integration alive on macOS for a plugin macOS never uses (Anselm plays video through the
      # official AVFoundation implementation there). A platform declared here is LINKED, whatever
      # Dart-side filtering says.
      #
      # **只留 linux** —— 这是与上游唯一的一行分歧,也是 vendor 它的全部理由。上游连 macos/ios 一起声明,
      # 于是 Flutter 为一个 macOS 根本用不到的插件把 CocoaPods 集成一直吊着(macOS 上视频走官方
      # AVFoundation)。**在这里声明了的平台就会被链接**,Dart 侧怎么过滤都不算数。
      linux:
        pluginClass: MediaKitVideoPlugin
