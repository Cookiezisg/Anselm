# Release notes from conventional commits (git-cliff). Used by the release workflow to fill the
# GitHub Release body for the range since the previous tag; `git cliff --latest` reproduces it.
# 由 conventional commits 生成 release notes;发行流水线用它填 Release 正文。

[changelog]
trim = true
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})\
{% endfor %}
{% endfor %}
{% if previous.version and version %}
**Full changelog:** https://github.com/Cookiezisg/Anselm/compare/{{ previous.version }}...{{ version }}
{% endif %}
"""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^release", skip = true },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^(chore|ci|build|style|test)", group = "<!-- 5 -->Maintenance" },
]
